name: Build Android APKs

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Keystore for Signing
        run: |
          keytool -genkey -v -keystore test.keystore -storepass android -alias testkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Seal Test,O=Seal,C=US"
          cat <<EOF > keystore.properties
          storeFile=../test.keystore
          storePassword=android
          keyAlias=testkey
          keyPassword=android
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Generic Release APKs
        run: ./gradlew assembleGenericRelease

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Seal-Release-APKs
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 30
